<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StreamTTS Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f5f5f5; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid rgba(0,0,0,.1); border-radius: 50%; border-top-color: #09f; animation: spin 1s ease-in-out infinite; }
        .success { color: #22c55e; font-size: 20px; }
        .failure { color: #ef4444; font-size: 20px; }
        .processing { color: #ff9900; font-size: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">Completing login…</h2>
        <div class="spinner" id="spinner"></div>
        <p class="processing" id="status">Please wait while StreamTTS finishes signing you in.</p>
        <p id="hint">You can close this tab once it's done.</p>
    </div>

    <script>
        // Read the provider's response, then drop it from the address bar so
        // the authorization code doesn't linger in history.
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const providerError = params.get('error');
        history.replaceState(null, '', window.location.pathname);

        const show = (title, message, className) => {
            document.getElementById('title').textContent = title;
            document.getElementById('spinner').remove();
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = className;
        };

        const showSuccess = () => {
            show('Login successful', 'You can close this tab and return to StreamTTS.', 'success');
            setTimeout(() => window.close(), 1000);
        };

        const showError = (message) => {
            show('Login failed', message, 'failure');
            document.getElementById('hint').textContent = 'Close this tab and try again from StreamTTS.';
        };

        const post = (path, body) => fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (providerError) {
            // Lets the app reset its login button; needs the state it issued.
            if (state) post('/auth-error', { state, error: providerError }).catch(() => {});
            showError(providerError === 'access_denied' ? 'The login was cancelled.' : 'The provider reported: ' + providerError);
        } else if (code && state) {
            post('/auth-exchange', { code, state })
                .then(async (response) => {
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && data.ok) {
                        showSuccess();
                    } else {
                        showError(data.error || 'StreamTTS could not complete the login.');
                    }
                })
                .catch(() => showError('Could not reach StreamTTS. Is the app still running?'));
        } else {
            showError('No login data was found in this link.');
        }
    </script>
</body>
</html>
